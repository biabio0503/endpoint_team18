# Add this Cron Job alongside the existing apps/api Web Service.
services:
  - type: cron
    name: team18-dacon-daily
    runtime: docker
    repo: https://github.com/biabio0503/endpoint_team18
    branch: main
    region: singapore
    plan: starter
    schedule: "10 0 * * *" # 09:10 Asia/Seoul, every day; Render uses UTC.
    # rootDir deliberately omitted: both crawling/ and apps/api/ must be present.
    dockerContext: .
    dockerfilePath: ./crawling/dacon/Dockerfile
    dockerCommand: python -m crawling.activities.run --mode scheduled
    envVars:
      - key: ROADMAP_DB_BACKEND
        value: postgres
      - key: ROADMAP_DATABASE_URL
        fromService:
          type: web
          name: endpoint_team18
          envVarKey: ROADMAP_DATABASE_URL
      - key: CONTESTKOREA_API_KEY
        fromService:
          type: web
          name: endpoint_team18
          envVarKey: CONTESTKOREA_API_KEY
      - key: PYTHONUNBUFFERED
        value: "1"
