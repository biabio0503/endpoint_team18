name: Verify MVP (isolated)

on:
  push:
    branches:
      - chore/verify-main-20261111
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI / SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROADMAP_DB_BACKEND: sqlite
      ROADMAP_AUTO_SEED_DEV: "0"
      ROADMAP_OCR_PROVIDER: none
      ROADMAP_INSECURE_LOCAL_COOKIE: "1"
      ROADMAP_APP_ORIGIN: http://localhost:3000
      GEMINI_LIVE_TEST: "0"
      GEMINI_API_KEY: ""
      ROADMAP_DATABASE_URL: ""
      ROADMAP_TEST_POSTGRES_URL: ""
      GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/team18-test-credentials.json
      PYTHONPATH: app
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: All isolated API tests (no paid providers)
        run: python -m pytest -q -rs
      - name: Python compile check
        run: python -m compileall -q app

  frontend:
    name: Next.js unit / production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      ROADMAP_API_ORIGIN: https://api.example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install lockfile dependencies
        run: npm ci
      - name: JavaScript unit tests
        run: node --experimental-vm-modules --test tests/unit/*.test.mjs
      - name: Next config check
        run: npm run check
      - name: Production build with inert API endpoint
        run: npm run build

  isolated-postgres:
    name: PostgreSQL 16 / document OCR invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: team18_document_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d team18_document_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: app
      ROADMAP_DB_BACKEND: sqlite
      ROADMAP_AUTO_SEED_DEV: "0"
      ROADMAP_OCR_PROVIDER: none
      GEMINI_LIVE_TEST: "0"
      GEMINI_API_KEY: ""
      ROADMAP_DATABASE_URL: ""
      ROADMAP_TEST_POSTGRES_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/team18_document_test
      ROADMAP_ALLOW_TEST_DB_RESET: "1"
      ROADMAP_OCR_TEST_BACKEND: postgres
      ROADMAP_INSECURE_LOCAL_COOKIE: "1"
      ROADMAP_APP_ORIGIN: http://localhost:3000
      GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/team18-test-credentials.json
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Enable TLS on the disposable test database
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --quiet --filter ancestor=postgres:16 | head -n 1)"
          test -n "$DB_CONTAINER"
          TMP_CERT_DIR="$(mktemp -d)"
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -subj "/CN=localhost" \
            -keyout "$TMP_CERT_DIR/server.key" \
            -out "$TMP_CERT_DIR/server.crt" >/dev/null 2>&1
          docker cp "$TMP_CERT_DIR/server.crt" "$DB_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker cp "$TMP_CERT_DIR/server.key" "$DB_CONTAINER:/var/lib/postgresql/data/server.key"
          docker exec --user root "$DB_CONTAINER" chown postgres:postgres /var/lib/postgresql/data/server.crt /var/lib/postgresql/data/server.key
          docker exec --user root "$DB_CONTAINER" chmod 0600 /var/lib/postgresql/data/server.key
          cat > "$TMP_CERT_DIR/ssl.conf" <<'CONFIG'
          ssl = on
          ssl_cert_file = 'server.crt'
          ssl_key_file = 'server.key'
          CONFIG
          docker cp "$TMP_CERT_DIR/ssl.conf" "$DB_CONTAINER:/tmp/team18-ssl.conf"
          docker exec --user root "$DB_CONTAINER" sh -c 'cat /tmp/team18-ssl.conf >> /var/lib/postgresql/data/postgresql.conf'
          docker restart "$DB_CONTAINER" >/dev/null
          for attempt in {1..30}; do
            if docker exec "$DB_CONTAINER" pg_isready -U postgres -d team18_document_test >/dev/null 2>&1; then break; fi
            sleep 1
          done
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['ROADMAP_TEST_POSTGRES_URL'], sslmode='require') as db:
              assert db.pgconn.ssl_in_use, "Isolated database is not using TLS"
          print("Disposable PostgreSQL TLS connection verified")
          PY
      - name: Verify disposable DB target
        run: |
          python -c "from tests.integration.postgres_test_safety import validate_reset_target; import os; print('Verified disposable DB:', validate_reset_target(os.environ['ROADMAP_TEST_POSTGRES_URL'], os.environ).split('@')[1])"
      - name: PostgreSQL document and OCR isolation tests
        run: |
          python -m pytest -q -rs \
            tests/unit/test_document_ocr.py \
            tests/unit/test_ocr_budget_boundaries.py \
            tests/unit/test_ocr_billing_period.py \
            tests/unit/test_ocr_preflight.py \
            tests/integration/test_documents_postgres.py
