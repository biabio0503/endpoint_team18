function drawLinks(){const svg=document.getElementById('flow-links');if(!svg)return;const parent=svg.parentElement;const base=parent.getBoundingClientRect();const box=id=>{const b=parent.querySelector(`[data-node="${id}"] .flow-preview`).getBoundingClientRect();return{x:b.x-base.x,y:b.y-base.y,w:b.width,h:b.height}};const a=box('start'),b=box('basic'),c=box('docs'),d=box('courses'),f=box('review'),g=box('result');const cy=q=>q.y+q.h/2;const pad=6;const path=(d,txt,x,y)=>`<path d="${d}" fill="none" stroke="#929ca5" stroke-width="1.4" marker-end="url(#arrow)"/><text x="${x}" y="${y}" text-anchor="middle">${txt}</text>`;svg.setAttribute('width',base.width);svg.setAttribute('height',base.height);svg.innerHTML=`<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#929ca5"/></marker><marker id="return-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#a0a8ae"/></marker></defs>`+path(`M${a.x+a.w+pad} ${cy(a)} L${b.x-pad} ${cy(b)}`,'다음',(a.x+a.w+b.x)/2,cy(a)-9)+path(`M${b.x+b.w+pad} ${cy(b)} L${c.x-pad} ${cy(c)}`,'다음',(b.x+b.w+c.x)/2,cy(b)-9)+path(`M${c.x+c.w/2} ${c.y+c.h+pad} L${d.x+d.w/2} ${d.y-35}`,'다음',c.x+c.w/2+20,(c.y+c.h+d.y-35)/2+3)+path(`M${d.x-pad} ${cy(d)} L${f.x+f.w+pad} ${cy(f)}`,'확인',(d.x+f.x+f.w)/2,cy(d)-9)+path(`M${f.x-pad} ${cy(f)} L${g.x+g.w+pad} ${cy(g)}`,'생성',(f.x+g.x+g.w)/2,cy(g)-9);const lx=a.x-13;svg.innerHTML+=`<path d="M${g.x-2} ${cy(g)+30} L${lx} ${cy(g)+30} L${lx} ${a.y+a.h+45} L${b.x+b.w/2} ${a.y+a.h+45} L${b.x+b.w/2} ${b.y+b.h+4}" fill="none" stroke="#a4adb5" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#return-arrow)"/>`;}

ourse.'+c.id+'.term',c.year+'학년 '+c.term)}</span></td><td><button class="course-toggle" type="button" role="switch" aria-checked="${selected.has(c.id)}" aria-label="${esc(courseName(c))} 이미 이수함" data-toggle="${c.id}"${saving||fail?' disabled':''}><span class="toggle-track" aria-hidden="true"></span><span>이미 이수함<br>${selected.has(c.id)?'선택됨':confirmed?'선택 안 함':'미선택'}</span></button></td></tr>`).join(''):'<tr><td colspan="4" class="muted">검색 결과가 없습니다. 기존 선택은 유지됩니다.</td></tr>'}</tbody></table><div class="wire-note">${e('courses.tableNote','과목명·코드·학점은 목록에서 제공합니다. 권장 학기와 실제 개설 학기는 다릅니다.')}</div>${state.variant==='changedcatalog'?`<details class="details-row" open><summary>${e('courses.outsideTitle','현재 목록 밖의 기존 선택 · 별도 보관')}</summary><div class="select-note">${e('courses.outsideBody','이전 학과·목록에서 선택한 과목을 이곳에 표시합니다. 이름이 비슷한 현재 과목으로 자동 이동하지 않습니다.')}</div></details>`:''}`}

function reviewScreen(){if(state.variant==='generating')return loadingScreen();if(state.variant==='generateerror')return `${heading('review','결과 생성에 실패한 경우를 보여주는 상태 예시입니다.')}<div class="empty-state"><strong>로드맵을 만들지 못했어요.</strong><p>입력과 확인 내용은 유지합니다. 오류를 확인하고 다시 시도할 수 있습니다.</p>${action('retry-generate','다시 시도',true)}${action('review-normal','분석 확인으로 돌아가기')}</div>`;
const items=[['role','본인 역할','문서에서 추출한 본인의 역할이 들어갑니다. 팀 전체 결과와 개인 기여를 구분합니다.'],['work','수행 내용·활용 지식','직접 수행한 활동과 사용한 방법·기술을 근거와 함께 정리하는 영역입니다.'],['outcome','프로젝트 결과','문서에서 확인한 결과물과 한계가 들어갑니다. 확인되지 않은 성과를 만들지 않습니다.']];
return `${heading('review','문서에서 추출한 내용을 확인하고 필요한 부분만 수정합니다. 모르는 항목은 확인 필요 상태로 남깁니다.')}<div class="columns"><section><h2 class="section-title">${e('review.extractedTitle','문서에서 추출한 내용')}</h2>${items.map(([id,title,desc])=>`<div class="analysis-item"><div class="analysis-item-head">${e('review.item.'+id+'.title',title)}<span class="status-chip">${state.confirmations[id]==='confirmed'?'사용자 확인':state.confirmations[id]==='corrected'?'사용자 수정':state.confirmations[id]==='unknown'?'확인 필요':'검토 전'}</span></div>${e('review.item.'+id+'.body',desc,'p')}${state.confirmations[id]==='corrected'?`<div class="select-note"><strong>사용자 수정</strong><br>${esc(state.corrections[id])}</div>`:''}<div class="analysis-actions"><button data-confirm="${id}" class="${state.confirmations[id]==='confirmed'?'selected':''}">${e('review.accept','맞아요')}</button><button data-correct="${id}">${e('review.correct','수정할게요')}</button><button data-unknown="${id}">${e('review.unknown','잘 모르겠어요')}</button><button data-evidence="${id}" class="quiet">${e('review.evidence','원문 근거 보기')}</button></div>${state.showCorrection===id?`<div class="correction"><textarea id="correction-${id}" data-correction="${id}" aria-label="${esc(title)} 수정 내용" placeholder="내가 직접 수행한 내용을 적어 주세요.">${esc(state.corrections[id]||'')}</textarea><button class="small-button" data-save-correction="${id}">수정 내용 반영</button></div>`:''}</div>`).join('')}</section><aside class="stack"><div class="wire-box soft"><h3>${e('review.sourceTitle','원문 근거')}</h3><div class="source-meta">${e('review.sourceMeta','근거 문서명 / 페이지 또는 문단 위치가 표시되는 영역')}</div><div class="source-placeholder">${e('review.sourceBody','선택한 분석 항목의 원문 구절이 이곳에 표시됩니다.','p')}<div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div><div class="tiny">현재 선택: ${esc(items.find(x=>x[0]===state.evidence)?.[1]||'본인 역할')}</div><div class="wire-note">${e('review.sourceCaution','문서에서 추출한 내용과 사용자가 추가한 답변을 구분해서 표시합니다.')}</div></div><div class="question"><h3>${e('review.questionTitle','추가 확인이 필요한 질문')}</h3>${e('review.questionBody','SQL을 직접 사용한 경험이 있나요? (가상 질문)','p','muted')}<div class="choice-group">${[['confirmed','경험 있어요'],['no_experience','경험 없어요'],['unknown','모르겠어요 / 보류']].map(([v,t])=>`<button data-question="${v}" class="${state.question===v?'active':''}">${e('review.question.'+v,t)}</button>`).join('')}</div>${state.question==='confirmed'?`<div class="correction"><textarea id="question-text" placeholder="직접 수행한 내용을 보완해 주세요." aria-label="추가 경험 설명">${esc(state.questionText)}</textarea></div>`:''}<div class="wire-note">${e('review.questionNote','‘경험 없음’과 ‘모름·보류’를 서로 다른 상태로 기록합니다.')}</div></div></aside></div>${footer('courses','generate','확인한 내용으로 로드맵 만들기',{note:'답변을 보류한 항목은 결과에서도 확인 필요로 표시합니다.'})}`}
function loadingScreen(){return `<div class="loading-screen"><span class="badge">생성 중 화면 예시</span><h2 style="margin-top:18px">${e('loading.title','로드맵을 구성하고 있어요.')}</h2><p class="muted">${e('loading.description','진로 목표, 확인한 경험과 이수 선택을 연결하는 처리 상태가 표시됩니다.')}</p><div class="wire-box soft">${['입력과 문서의 분석 가능 상태 확인','외부 요구 기술과 현재 경험 비교','로드맵·수강 후보·관련 활동 추천 구성'].map((t,i)=>`<div class="step-loading"><span class="step-square" aria-hidden="true"></span>${e('loading.step'+i,t)}</div>`).join('')}</div><div class="wire-note">실제 AI 분석을 실행하지 않는 목업입니다. 아래 버튼으로 결과 화면을 확인합니다.</div><div style="margin-top:21px">${action('finish-generate','생성 완료 화면 보기',true)} ${action('review-normal','분석 확인으로 돌아가기')}</div></div>`}
function resultStatus(snap){return `<div class="state-triad"><section class="wire-box"><span class="status-chip dark">문서·답변 근거 있음</span><h3>${e('result.status.knownTitle','확인된 경험')}</h3>${e('result.status.knownBody','프로젝트에서 확인한 본인 역할, 수행 활동과 이수 선택을 정리하는 영역입니다.','p')}<button data-action="result-evidence" class="small-button">${e('result.status.evidence','판단 근거 보기')}</button></section><section class="wire-box"><span class="status-chip outline">자료·답변 확인 필요</span><h3>${e('result.status.unknownTitle','아직 확인이 필요한 항목')}</h3>${e('result.status.unknownBody','문서에 없거나 답변을 보류한 경험을 표시합니다. 곧바로 부족한 역량으로 단정하지 않습니다.','p')}<button data-action="edit-review" class="small-button">${e('result.status.answer','확인 내용 수정')}</button></section><section class="wire-box"><span class="status-chip">준비 방향 제안</span><h3>${e('result.status.prepareTitle','추가로 준비할 내용')}</h3>${e('result.status.prepareBody','경험이 없다고 답한 항목과 목표에 필요한 준비를 이유와 함께 제안하는 영역입니다.','p')}<button data-tab="roadmap" class="small-button">${e('result.status.roadmap','실행 로드맵 보기')}</button></section></div><div class="result-discovery"><section class="wire-box soft"><span class="design-label">${e('result.status.externalTag','외부 요구와 현재 경험')}</span><h3>${e('result.status.externalTitle','직무 역량 비교')}</h3><p>${e('result.status.externalBody','수집한 채용공고의 필수·우대 기술과 내 경험을 비교합니다. 확인된 경험, 확인할 항목, 보완할 내용을 근거와 함께 보여줍니다.')}</p><button class="small-button" data-tab="skills">${e('result.status.skillsLink','기술 스택·보완점 보기')}</button></section><section class="wire-box soft"><span class="design-label">${e('result.status.activitiesTag','다음 행동에 연결되는 외부 기회')}</span><h3>${e('result.status.activitiesTitle','공모전·대외활동 추천')}</h3><p>${e('result.status.activitiesBody','희망 직무와 현재 경험에 도움이 되는 활동을 제안합니다. 추천 이유와 보완 항목, 참가 조건 및 모집 확인 상태를 함께 보여줍니다.')}</p><button class="small-button" data-tab="activities">${e('result.status.activitiesLink','추천 활동 보기')}</button></section></div><div class="select-note">${e('result.status.principle','과목 이수만으로 실무 역량을 확정하거나 객관적으로 검증하지 않은 역량 점수를 표시하지 않습니다.')}</div>`}

function resultSkills(snap){
 if(state.variant==='sourceerror')return externalEmpty('skills');
 const sql=sqlComparison(snap), work=snap.confirmations?.work, corrected=snap.corrections?.work;
 const workStatus=work==='confirmed'?'문서 경험 확인':work==='corrected'?'사용자 수정 · 연결 확인':'확인 필요';
 const workBody=work==='corrected'&&corrected?corrected:work==='confirmed'?'문서의 수행 내용을 사용자가 확인했습니다. 기술을 사용한 범위와 본인 기여를 함께 표시합니다.':'문서에서 추출한 데이터 정리 활동과 본인 기여를 확인하는 영역입니다. 아직 사용자 확인 전입니다.';

 return `<div class="result-section-title"><div><h2>${e('skills.title','외부 요구와 나의 경험 비교')}</h2><p>${e('skills.intro','희망 직무의 요구 기술을 현재 경험과 나란히 비교하고, 보완할 내용과 다음 행동을 연결합니다.')}</p></div><span class="status-chip outline">${e('external.exampleTag','수집 데이터 표시 영역 · 가상 예시')}</span></div>${targetBasis(snap)}<div class="wire-note">${e('skills.exampleNote','아래 기술명은 데이터 분석 직무의 가상 예시입니다. 실제 결과에는 선택한 직무·관심 분야에서 수집한 요구가 들어갑니다. 필수·우대는 해당 공고의 조건이며 직무 전체의 확정 요건이 아닙니다.')}</div><div class="comparison-wrap"><table class="data-table skill-table"><thead><tr><th style="width:17%">${e('skills.col1','요구 기술·활동')}</th><th style="width:23%">${e('skills.col2','외부 요구 근거')}</th><th style="width:29%">${e('skills.col3','내 현재 상태·근거')}</th><th style="width:31%">${e('skills.col4','판단·다음 행동')}</th></tr></thead><tbody>
 <tr><td><strong>${e('skills.python.title','Python · 데이터 정리')}</strong><small>${e('skills.python.topic','기술 스택 예시')}</small></td><td><span class="status-chip dark">${e('skills.required','필수 · 채용공고 A')}</span><p>${e('skills.python.demand','데이터 정리·가공 수행 요구가 들어가는 영역')}</p>${sourceButton('job-a')}</td><td><span class="status-chip outline">${e('skills.workStatus.'+workStatus,workStatus)}</span><p>${work==='corrected'?esc(workBody):e('skills.workBody.'+work,workBody)}</p><small>${e('skills.python.evidence','근거: 프로젝트 문서 · 수행 내용 / 사용자 확인')}</small></td><td><p>${e('skills.python.next.'+work,work==='confirmed'?'확인된 수행 범위를 바탕으로 기존 프로젝트의 데이터 정리 과정을 확장합니다. 숙련도 점수로 환산하지 않습니다.':'본인 역할과 수행 범위를 먼저 확인합니다. 자료를 확인한 뒤 프로젝트를 확장할 부분을 제안합니다.')}</p>${nextButton(work==='confirmed'?'roadmap':'review',work==='confirmed'?'연결 로드맵 보기':'경험 확인하기','skills.python.action.'+work)}</td></tr>
 <tr><td><strong>${e('skills.sql.title','SQL · 조회·집계')}</strong><small>${e('skills.sql.topic','기술 스택 예시')}</small></td><td><span class="status-chip dark">${e('skills.required','필수 · 채용공고 A')}</span><p>${e('skills.sql.demand','SQL로 데이터를 조회·집계하는 요구가 들어가는 영역')}</p>${sourceButton('job-a')}</td><td><span class="status-chip ${snap.question==='no_experience'?'dark':'outline'}">${e('skills.sql.state.'+snap.question,sql.status)}</span><p>${snap.question==='confirmed'&&(snap.questionText||'').trim()?esc(sql.body):e('skills.sql.body.'+snap.question,sql.body)}</p><small>${e('skills.sql.evidence','근거: 분석 확인 화면의 SQL 경험 답변')}</small></td><td><p>${e('skills.sql.next.'+snap.question,sql.next)}</p>${nextButton(sql.action,sql.action==='review'?'경험 확인하기':'연결 로드맵 보기','skills.sql.action.'+snap.question)}</td></tr>
 <tr><td><strong>${e('skills.report.title','분석 결과 설명')}</strong><small>${e('skills.report.topic','시각화·보고서·결과 전달')}</small></td><td><span class="status-chip">${e('skills.preferred','우대 · 채용공고 B')}</span><p>${e('skills.report.demand','분석 결과 설명 경험')}</p><span class="status-chip outline">${e('skills.submission','제출물 · 공모전 A')}</span><p>${e('skills.report.submission','분석 보고서와 시각화 결과')}</p><div class="source-buttons">${sourceButton('job-b')}${sourceButton('contest-a')}</div></td><td><span class="status-chip outline">${e('skills.report.state','결과물 근거 확인')}</span><p>${e('skills.report.body','문서의 결과물과 본인 설명 범위를 확인합니다. 보고서의 존재만으로 설명 역량을 확정하지 않습니다.')}</p><small>${e('skills.report.evidence','근거: 프로젝트 결과 구절 · 사용자 보완 답변')}</small></td><td><p>${e('skills.report.next','문제·방법·결과·한계를 정리할 활동을 제안합니다. 관련 공모전·대외활동에서 결과물을 만들 수 있습니다.')}</p>${nextButton('activities','연결 활동 보기','skills.report.activities')}</td></tr>
 </tbody></table></div><div class="comparison-footer"><p>${e('skills.principle','과목 이수는 학습 이력으로 참고합니다. 문서에 없는 경험과 사용자가 경험이 없다고 답한 항목은 구분합니다.')}</p><div><button class="small-button" data-tab="roadmap">${e('skills.roadmap','보완 행동의 실행 순서 보기')}</button><button class="small-button" data-tab="courses">${e('skills.courses','연결 수강 후보 보기')}</button></div></div>`
}

function resultActivities(snap){
 if(state.variant==='sourceerror')return externalEmpty('activities');
 const empty=state.variant==='noactivities',outdated=state.variant==='stalesources';

 const activities=[{id:'contest-a',type:'공모전',relevance:'데이터 정리와 분석 결과 설명을 함께 다루는 과제를 찾는 영역입니다.',gap:snap.question==='no_experience'?'SQL 기초 수행 후 분석 과정과 결과 보고서로 확장':snap.question==='confirmed'?'사용자가 설명한 경험을 적용하고 결과물 근거 보완':'SQL 경험 확인 후 적용 범위를 정하고 결과 설명 경험 보완',skills:'Python · SQL · 분석 보고서',stage:'2단계 프로젝트 확장 → 3단계 결과 점검',output:'재현 가능한 분석 파일과 문제·방법·결과 설명'}, {id:'activity-b',type:'대외활동',relevance:'목표 분야의 협업·시각화·발표 경험을 쌓을 수 있는 활동을 찾는 영역입니다.',gap:'본인 역할과 분석 결과를 다른 사람에게 설명하는 경험 확장',skills:'협업 · 시각화 · 결과 발표',stage:'3단계 결과 점검 → 4단계 경험 정리',output:'본인 기여, 피드백과 개선 내용을 담은 결과 정리'}];

function resultScreen(){const snap=shownSnapshot();const historical=state.historyIndex<state.history.length-1;const stale=state.changed||state.variant==='stale';return `<div class="result-head"><div>${heading('result','입력 기준과 추천 이유를 함께 확인하는 결과 화면입니다. 아래는 결과 구조를 설명하는 가상 예시입니다.')}</div><div class="result-actions"><select id="history-version" aria-label="이전 결과 선택">${state.history.length?state.history.map((h,i)=>`<option value="${i}"${i===state.historyIndex?' selected':''}>결과 v${h.version}</option>`).reverse().join(''):'<option>결과 예시 v1</option>'}</select>${action('edit-inputs','입력 수정',false,'button.result.next')}</div></div>${stale?`<div class="changed-banner"><div><strong>${e('result.staleTitle','입력이 변경되었어요.')}</strong><small>${e('result.staleBody','아래는 변경 전 입력으로 만든 결과입니다. 수정 내용을 확인하고 재분석하면 새 결과를 생성합니다.')}</small></div><div style="display:flex;gap:7px"><button data-action="changes">${e('result.changes','변경 내용')}</button><button class="primary" data-action="reanalyze">${e('result.reanalyze','수정 내용으로 재분석')}</button></div></div>`:''}${historical?'<div class="notice"><strong>이전 결과를 보고 있어요.</strong> 이 결과는 생성 당시 입력 기준입니다. 상단 결과 선택에서 최신 결과로 돌아갈 수 있습니다.</div>':''}${state.variant==='generateerror'?'<div class="notice error"><strong>재분석에 실패했어요.</strong> 이전 결과는 보관됩니다. <button data-action="reanalyze" class="small-button">다시 시도</button></div>':''}<div class="result-summary"><div><span>${e('result.summary.goal','진로 목표')}</span><strong>${esc(snap.forms.goal)}</strong></div><div><span>${e('result.summary.source','생성 당시 입력 기준')}</span><strong>${snap.limited?'학업 자료 미지원':'교육과정 예시 '+esc(snap.forms.catalog||'v1')+' / 이수 선택 '+snap.selected.length+'개'}</strong><small>${snap.limited?'학업 자료 미지원':snap.missing?'일부 누락 · 부분 확인':snap.confirmed?'제공된 목록 범위 확인':'목록 선택 미확인'} · 문서와 사용자 답변 기준</small></div></div><nav class="result-tabs" aria-label="결과 구성" role="tablist">${resultTabOptions.map(([id,t])=>`<button type="button" role="tab" id="tab-${id}" aria-controls="result-tab-panel" aria-selected="${stat function designNotes(){const notes={start:['이 화면에서 확인할 것','서비스 목적, 초기 지원 범위, 준비할 입력과 결과 안내','다음 이동','새 계획은 02 기본 정보로 이동합니다. 이어서 작성은 보관된 입력을 엽니다.'],basic:['입력 구성','진로 목표는 왼쪽, 학교·학업은 오른쪽입니다. 학점 정보는 선택 입력으로 접어 둡니다.','데이터 명세 반영','목표·관심 분야를 입력하고, 수강 제안에 필요한 학교·학과·목록은 기준 데이터에서 고릅니다.'],docs:['다음으로 갈 수 있는 조건','읽기 완료 또는 읽힌 범위를 확인한 일부 추출 문서가 1개 이상 필요합니다.','동작 범위','파일 선택은 목업 상태만 바꿉니다. 실제 파일 업로드, 문서 분석, OCR은 수행하지 않습니다.'],courses:['확인의 범위','검색된 일부가 아니라 현재 목록 전체의 선택을 확인합니다. 검색·필터를 바꿔도 선택은 유지합니다.','선택 변경 이후','토글·학과·목록 변경은 확인을 해제합니다. 기존 결과가 있다면 입력 변경 상태만 표시하고 재분석은 별도로 요청합니다.'],review:['확인과 근거','추출 경험의 원문을 옆에서 확인합니다. 사용자 수정·추가 답변은 문서 원문과 구분합니다.','결과 생성','경험 없음과 모름·보류를 구분합니다. 생성 중·실패 상태는 상단의 시연용 상태에서 볼 수 있습니다.'],result:['같은 페이지 안의 다섯 탭','기존 준비 상태·로드맵·수강 후보에 직무 역량 비교와 공모전·대외활동 추천을 더했습니다. 외부 자료는 가상 예시입니다.','수정과 재분석','입력 수정은 02–05 화면을 재사용합니다. 변경된 입력을 확인하고 재분석해야 새 결과로 바뀝니다.']};const a=notes[state.screen];return `<div class="notes-under"><div><strong>${e(state.screen+'.note1title',a[0])}</strong><p>${e(state.screen+'.note1',a[1])}</p></div><div><strong>${e(state.screen+'.note2title',a[2])}</strong><p>${e(state.screen+'.note2',a[3])}</p></div></div>`}
function detail(){const p=pageInfo(state.screen);return `<div class="detail-layout"><aside class="screen-list"><h2>화면 목록</h2>${pages.map(x=>`<button type="button" class="${x.id===state.screen?'active':''}" data-open="${x.id}"${x.id===state.screen?' aria-current="page"':''}><span class="screen-num">${x.n}</span><span>${esc(pageTitle(x.id))}</span></button>`).join('')}<div class="side-note">실제 페이지 6개<br>결과 안에 세부 탭 5개<br><br>수정 화면은<br>기존 입력 화면 재사용</div></aside><main class="detail-main"><div class="detail-top"><div class="screen-heading">${p.n}. ${esc(pageTitle(p.id))}<small>${esc(p.subtitle)}</small></div><label class="state-picker" for="variant">시연용 상태<select id="variant">${variants[state.screen].map(([v,t])=>`<option value="${v}"${state.variant===v?' selected':''}>${t}</option>`).join('')}</select></label></div>${state.edit?'<div class="edit-strip"><span><strong>문구 편집 중</strong> · 점선 안의 문구를 눌러 수정하세요. 화면 속 버튼 이동은 잠시 멈춥니다.</span><button type="button" class="small-button" data-tool="edit">편집 마치기</button></div>':''}<div class="browser-window"><div class="browser-bar"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><div class="browser-url">career-roadmap.example${p.path}</div><span class="browser-tag">데스크톱 웹</span></div><div class="service">${serviceHeader()}<div class="service-content">${stepper()}${screenBody()}</div></div></div>${designNotes()}</main></div>`}
function modalHtml(){if(!state.modal)return '';let title='',body='',foot='';if(state.modal==='help'){title='목업 사용법';body=`<ol><li><strong>전체 흐름</strong>에서 화면을 누르면 크게 볼 수 있습니다. 화면 안의 이전·다음 버튼으로 순서를 따라가세요.</li><li><strong>시연용 상태</strong>에서 저장 실패, 일부 추출, 자료 미지원 같은 상태를 확인할 수 있습니다.</li><li><strong>내용 편집</strong>을 누른 뒤 점선 안의 제목·설명·버튼 문구를 직접 고치세요. 편집 중에는 화면 속 버튼 이동이 멈춥니다.</li><li><strong>수정본 저장</strong>을 누르면 수정 문구와 입력 예시를 포함한 HTML을 내려받습니다. 그 파일을 브라우저에서 열면 다시 편집할 수 있습니다.</li></ol><p>같은 브라우저에서는 변경 내용이 자동 보관됩니다. 브라우저 데이터를 지우기 전이나 다른 사람에게 전달할 때는 수정본을 저장하세요.</p><p><strong>박스 위치·연결선 수정</strong>은 함께 제공하는 PPTX에서 할 수 있습니다. HTML과 PPTX는 각각 편집하며 자동 동기화되지 않습니다.</p><div class="notice">모든 문서·과목·외부 공고·활동·결과는 가상 예시입니다. 실제 문서 업로드, 외부 사이트 크롤링, AI 분석은 실행하지 않습니다.</div>`;foot='<button data-action="reset-dialog" class="quiet">문구를 초기 상태로 되돌리기</button><button data-action="close-modal" class="primary">알겠어요</button>'}

if(state.modal==='partial'){title='일부만 읽힌 문서 확인';body=`<div class="status-chip outline">일부 추출 · 가상 예시</div><p>본문 텍스트를 읽었지만 이미지에 있는 글은 읽지 못했습니다. 읽힌 구간과 누락 가능 구간이 표시되는 영역입니다.</p><div class="source-placeholder">${e('docs.partialPreview','읽힌 원문 내용이 표시됩니다. 이미지·도표의 글은 별도 확인이 필요합니다.')}</div><p>확인하면 읽을 수 있는 텍스트 범위만 경험 분석에 포함합니다.</p>`;foot='<button data-action="close-modal">닫기</button><button data-action="confirm-partial" class="primary">읽힌 범위를 확인했어요</button>'}
if(state.modal==='docsource'||state.modal==='evidence'){title='원문 근거 표시 영역';body=`<div class="source-meta">${e('source.filename','프로젝트_보고서_예시.pdf / 페이지 또는 문단 위치')}</div><div class="source-placeholder">${e('source.body','이곳에는 분석 항목의 근거가 된 문서 구절이 표시됩니다. 현재 목업에는 실제 문서가 연결되어 있지 않습니다.')}</div><p>사용자가 직접 수정한 내용은 ‘사용자 답변’으로 구분합니다.</p>`;foot='<button data-action="close-modal" class="primary">닫기</button>'}
if(state.modal==='edit'){title='어떤 입력을 수정할까요?';body=`<p>기존 입력 화면으로 돌아갑니다. 수정 후 이전 결과를 유지하며, 재분석을 눌러 변경 내용을 반영합니다.</p><div class="modal-grid">${['basic','docs','courses','review'].map(id=>`<button data-action="edit-${id}">${pageInfo(id).n}. ${esc(pageTitle(id))}<small>${esc(pageInfo(id).subtitle)}</small></button>`).join('')}</div>`;foot='<button data-action="close-modal">닫기</button>'}
if(state.modal==='changes'){const snap=shownSnapshot();title='변경된 입력과 결과 기준';body=`<table class="data-table"><thead><tr><th>항목</th><th>표시 중인 결과 기준</th><th>현재 입력</th></tr></thead><tbody><tr><td>이수 선택</td><td>${snap.selected.length}개</td><td>${state.selected.size}개</td></tr><tr><td>목록 확인</td><td>${snap.confirmed?'확인됨':'미확인'}</td><td>${state.courseConfirmed?'확인됨':'다시 확인 필요'}</td></tr><tr><td>목표</td><td>${esc(snap.forms.goal)}</td><td>${esc(state.forms.goal)}</td></tr></tbody></table><p>문서·확인 답변을 포함한 입력은 생성 시점별로 연결합니다.</p>`;foot='<button data-action="close-modal">닫기</button><button data-action="reanalyze" class="primary">수정 내용으로 재분석</button>'}
if(state.modal==='course'){const c=courseData.find(x=>x.id===state.modalData)||courseData[3];title=courseName(c)+' · 가상 과목 상세';body=`<div class="status-chip outline">교육과정상 후보 / 개설 여부 미확인</div><p><strong>과목 내용</strong><br>${e('courseDetail.description','확보한 강의 개요·학습 내용이 표시되는 영역입니다. 과목명만으로 내용을 추정하지 않습니다.')}</p><p><strong>추천 근거</strong><br>${e('courseDetail.reason','준비 보완점 및 로드맵 활동과 이 과목의 연결 이유가 표시됩니다.')}</p><p><strong>출처와 확인 범위</strong><br>${e('courseDetail.source','과목 설명 자료의 출처·확인 시점, 선수 조건·개설 여부의 확인 상태를 표시합니다.')}</p><div class="notice">현재 과목의 이름·코드·학점은 화면 설계를 위한 가상 예시입니다.</div>`;foot='<button data-action="close-modal" class="primary">닫기</button>'}

if(state.modal==='external'){const snap=shownSnapshot(),id=state.modalData,src=resultSources(snap)[id]||externalSources['job-a'];title='외부 원문·수집 근거 예시';body=`<span class="status-chip outline">${e('external.source.'+id+'.kind',src.kind)}</span><h3>${e('external.source.'+id+'.title',src.title)}</h3><dl class="source-detail"><div><dt>${e('external.scopeLabel','적용 범위')}</dt><dd>${e('external.source.'+id+'.scope',src.scope)}</dd></div><div><dt>${e('external.requirementLabel','요구 항목')}</dt><dd>${e('external.source.'+id+'.requirement',src.requirement)}</dd></div><div><dt>${e('external.urlLabel','원문 URL')}</dt><dd>${e('external.source.'+id+'.url','[실제 원문 링크가 표시되는 영역]')}</dd></div><div><dt>${e('external.collectedLabel','수집 / 원문 확인')}</dt><dd>${e('external.source.'+id+'.checked','[수집 시각] / [원문 확인 시각] · 실제 수집 전')}</dd></div><div><dt>${e('external.versionLabel','이 결과의 자료 기준')}</dt><dd>${e('external.snapshotVersion',snap.external?.version||'외부 자료 예시 v1')}</dd></div></dl><div class="source-placeholder">${e('external.source.'+id+'.excerpt',src.excerpt)}</div><p>${e('external.sourceNote','실제 결과에서는 수집한 원문의 해당 구절과 출처를 확인할 수 있습니다. 이 화면은 들어갈 내용의 위치를 설명하는 목업입니다.')}</p>`;foot=`<button data-tool="modal-edit">${state.edit?'편집 마치기':'이 설명 편집'}</button><button data-action="close-modal" class="primary">닫기</button>`}

return `<div class="modal-overlay" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-title"><h2 id="modal-title">${esc(title)}</h2><button data-action="close-modal" aria-label="대화상자 닫기">닫기</button></div>${body}<div class="modal-footer">${foot}</div></section></div>`}
function render(){const focus=document.activeElement;const id=focus?.id;const caret=focus&&'selectionStart'in focus?focus.selectionStart:null;const detailsOpen=!!root.querySelector('details.details-row[open]');root.className=state.edit?'is-editing':'';root.innerHTML=header()+(state.view==='board'?board():detail())+modalHtml();if(state.view==='board')requestAnimationFrame(drawLinks);if(detailsOpen&&state.screen==='basic'){const d=root.querySelector('details.details-row');if(d)d.open=true}if(id){const next=document.getElementById(id);if(next){next.focus({preventScroll:true});try{if(caret!==null)next.setSelectionRange(caret,caret)}catch(err){}}}if(state.modal)requestAnimationFrame(()=>root.querySelector('.modal')?.focus({preventScroll:true}))}
function editRecord(el){const key=el.dataset.edit;if(!key)return;state.labels[key]=el.innerText.replace(/\r/g,'').replace(/\n{3,}/g,'\n\n');root.querySelectorAll('[data-edit]').forEach(other=>{if(other!==el&&other.dataset.edit===key)other.textContent=state.labels[key]});persist()}
function showModal(name,data=null){state.modal=name;state.modalData=data;render()}
function validBasic(){if(!state.forms.goal.trim()){toast('목표·관심 분야를 입력해 주세요.');document.getElementById('f-goal')?.focus();return false}if(state.forms.credits!==''&&Number(state.forms.credits)<0){toast('취득학점은 0 이상이어야 합니다.');return false}if(state.forms.gpa!==''&&(Number(state.forms.gpa)<0||Number(state.forms.gpa)>Number(state.forms.scale))){toast('GPA는 0부터 선택한 만점 사이여야 합니다.');return false}return true}
function generate(){if(!validBasic()){openScreen('basic');return}if(!state.docReady){openScreen('docs');toast('분석 가능한 문서 예시를 먼저 등록해 주세요.');return}if(!state.courseConfirmed&&!state.limited&&state.forms.school!=='unsupported'){openScreen('courses');toast('현재 과목 목록의 이수 선택을 먼저 확인해 주세요.');return}openScreen('review','generating')}
function finishGenerate(){state.history.push(snapshot());state.historyIndex=state.history.length-1;state.hasResult=true;state.changed=false;state.editingInput=false;state.tab='status';openScreen('result');toast('현재 입력을 반영한 결과 화면 예시입니다. 실제 분석은 실행하지 않았습니다.')}
function exportHTML(){if(document.activeElement?.matches('[data-edit][contenteditable=true]'))editRecord(document.activeElement);const data=persist();data.documentId='career-roadmap-edited-'+Date.now();const clone=document.documentElement.cloneNode(true);clone.querySelector('#wireframe-seed').textContent=JSON.stringify(data).replace(/</g,'\\u003c');clone.querySelector('#app').innerHTML='';clone.querySelector('#app').className='';clone.querySelectorAll('.toast').forEach(x=>x.remove());const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='career-roadmap-mockup-edited.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('수정 문구를 포함한 HTML을 저장했습니다. 저장한 파일을 다시 열어 편집할 수 있어요.')}
root.addEventListener('click',event=>{const target=event.target;const tool=target.closest('[data-tool]');if(tool){const t=tool.dataset.tool;if(t==='board'){state.view='board';render()}if(t==='screen'){state.view='screen';render()}if(t==='edit'){if(state.view==='board'){state.view='screen';state.screen='start'}state.edit=!state.edit;persist();render()}if(t==='modal-edit'){state.edit=!state.edit;persist();render()}if(t==='export')exportHTML();if(t==='help')showModal('help');return}const open=target.closest('[data-open]');if(open){openScreen(open.dataset.open);return}if(state.edit&&target.closest('.service')){const ed=target.closest('[data-edit]');if(ed)ed.focus();return}if(target.closest('[data-edit][contenteditable=true]'))return;const toggler=target.closest('[data-toggle]');if(toggler){const id=toggler.dataset.toggle;if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);state.courseConfirmed=false;state.variant='normal';dirty();render();return}const tab=target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.modal=null;render();document.getElementById('tab-'+state.tab)?.focus();return}const conf=target.closest('[data-confirm]');if(conf){state.confirmations[conf.dataset.confirm]='confirmed';dirty();render();return}const correction=target.closest('[data-correct]');if(correction){state.showCorrection=correction.dataset.correct;render();document.getElementById('correction-'+state.showCorrection)?.focus();return}const saveCorrection=target.closest('[data-save-correction]');if(saveCorrection){const id=saveCorrection.dataset.saveCorrection;if(!(state.corrections[id]||'').trim()){toast('수정한 내용을 입력해 주세요.');return}state.confirmations[id]='corrected';state.showCorrection=null;dirty();render();return}const unknown=target.closest('[data-unknown]');if(unknown){state.confirmations[unknown.dataset.unknown]='unknown';dirty();render();return}const evidence=target.closest('[data-evidence]');if(evidence){state.evidence=evidence.dataset.evidence;render();return}const q=target.closest('[data-question]');if(q){state.question=q.dataset.question;dirty();render();return}const ext=target.closest('[data-external-source]');if(ext){showModal('external',ext.dataset.externalSource);return}const cd=target.closest('[data-course-detail]');if(cd){showModal('course',cd.dataset.courseDetail);return}const act=target.closest('[data-action]');if(!act)return;const id=act.dataset.action;if(id.startsWith('go-')){openScreen(id.slice(3));return}if(id.startsWith('edit-')&&id!=='edit-inputs'){state.editingInput=true;openScreen(id.slice(5));return}
switch(id){case'start.next':openScreen('basic');break;case'resume':openScreen('basic');toast('이 브라우저에 보관한 입력 예시를 이어서 보여줍니다.');break;case'basic.next':if(validBasic()){state.limited=state.forms.school==='unsupported'||state.variant==='unsupported';openScreen('docs')}break;case'docs.next':openScreen('courses');break;case'courses.next':openScreen('review');break;case'doc-add':if(!state.docReady){state.docReady=true;state.variant='normal'}else state.docAdded=true;invalidateDocuments();render();toast('문서 등록 상태를 추가했습니다. 실제 파일은 업로드하지 않습니다.');break;case'doc-remove':state.docReady=false;invalidateDocuments();render();break;case'doc-remove-added':state.docAdded=false;state.variant='normal';invalidateDocuments();render();break;case'doc-retry':state.docReady=true;state.variant='normal';invalidateDocuments();render();break;case'doc-source':showModal('docsource');break;case'partial':showModal('partial');break;case'confirm-partial':state.partialConfirmed=true;state.modal=null;dirty();render();break;case'course-retry':state.variant='normal';render();break;case'save-retry':state.variant='normal';render();toast('선택 저장 완료 상태로 돌아왔어요.');break;case'confirm-courses':state.courseConfirmed=true;state.limited=false;state.variant=state.missing?'missing':'confirmed';dirty();render();toast(state.missing?'제공된 목록을 부분 확인한 상태입니다.':'현재 목록 전체의 이수 선택을 확인했습니다.');break;case'continue-limited':state.limited=true;state.courseConfirmed=false;openScreen('review');break;case'generate':case'retry-generate':generate();break;case'finish-generate':finishGenerate();break;case'review-normal':openScreen('review');break;case'edit-inputs':showModal('edit');break;case'back-result':openScreen('result');break;case'changes':showModal('changes');break;case'reanalyze':state.modal=null;generate();break;case'result-evidence':showModal('evidence');break;case'close-modal':state.modal=null;render();break;case'reset-dialog':showModal('reset');break;case'confirm-reset':state.labels={...seed.labels};state.modal=null;persist();render();toast('문구를 이 파일의 초기 상태로 되돌렸어요.');break}
});
root.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-edit]')){editRecord(el);return}if(el.dataset.field){state.forms[el.dataset.field]=el.value;dirty();return}if(el.id==='course-search'){state.search=el.value;render();return}if(el.dataset.correction){state.corrections[el.dataset.correction]=el.value;persist();return}if(el.id==='question-text'){state.questionText=el.value;dirty()}});
root.addEventListener('change',event=>{const el=event.target;if(el.dataset.field){state.forms[el.dataset.field]=el.value;if(['school','department','catalog'].includes(el.dataset.field)){state.courseConfirmed=false;state.limited=state.forms.school==='unsupported'}dirty();if(el.tagName==='SELECT')render();return}if(el.id==='variant'){state.variant=el.value;if(state.screen==='result'){if(el.value==='sourceerror')state.tab='skills';if(['noactivities','stalesources'].includes(el.value))state.tab='activities'}if(state.screen==='basic'&&el.value==='unsupported'){state.forms.school='unsupported';state.limited=true;state.courseConfirmed=false}else if(state.screen==='basic'&&el.value==='normal'){state.forms.school='supported';state.limited=false}if(state.screen==='courses'){if(el.value==='confirmed')state.courseConfirmed=true;else state.courseConfirmed=false;if(el.value==='zero')state.selected.clear();if(el.value==='missing')state.missing=true;if(el.value==='normal')state.missing=false;if(el.value==='changedcatalog')state.courseConfirmed=false;}if(state.screen==='docs')state.docReady=true;if(['basic','courses'].includes(state.screen))dirty();render();return}if(el.id==='course-year'){state.filterYear=el.value;render()}if(el.id==='course-category'){state.filterCategory=el.value;render()}if(el.id==='only-selected'){state.onlySelected=el.checked;render()}if(el.id==='missing-courses'){state.missing=el.checked;state.courseConfirmed=false;dirty();render()}if(el.id==='history-version'){state.historyIndex=Number(el.value);render()}});
root.addEventListener('focusout',event=>{if(event.target.matches('[data-edit][contenteditable=true]'))editRecord(event.target)});
root.addEventListener('paste',event=>{const el=event.target.closest('[contenteditable=true]');if(!el)return;event.preventDefault();const text=event.clipboardData.getData('text/plain');const sel=window.getSelection();if(!sel||!sel.rangeCount)return;const range=sel.getRangeAt(0);range.deleteContents();const node=document.createTextNode(text);range.insertNode(node);range.setStartAfter(node);range.collapse(true);sel.removeAllRanges();sel.addRange(range);editRecord(el)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.modal){state.modal=null;render()}else if(state.edit){state.edit=false;render()}}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();exportHTML()}if(state.modal&&event.key==='Tab'){const dialog=root.querySelector('.modal');const items=Array.from(dialog.querySelectorAll('button,input,select,textarea,[contenteditable=true]')).filter(x=>!x.disabled);if(!items.length)return;const first=items[0],last=items[items.length-1];if(event.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
window.addEventListener('resize',drawLinks);
render();
})();
</script>
</body>
